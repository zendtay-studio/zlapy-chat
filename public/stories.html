<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101419">
  <title>Historias</title>
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/popmenu.css?v=1">
  <script src="/js/transport-crypto.js"></script>
  <script src="/js/transport.js"></script>
  <script>
    /* Aplica el acento cacheado del usuario antes de pintar para que no parpadee */
    try {
      var hint = JSON.parse(localStorage.getItem('chatlocal_appearance_hint') || 'null'), ok = function (c) { return /^#[0-9a-f]{6}$/i.test(c || ''); };
      if (hint && ok(hint.sender)) {
        var ink = ok(hint.senderText) ? hint.senderText : '#101318', other = ok(hint.receiver) ? hint.receiver : '#171b21', r = document.documentElement.style;
        r.setProperty('--accent', hint.sender);
        r.setProperty('--accent-ink', ink);
        r.setProperty('--accent-secondary', other);
        r.setProperty('--accent-hover', 'color-mix(in srgb, ' + hint.sender + ' 88%, ' + ink + ')');
        r.setProperty('--accent-soft', 'color-mix(in srgb, ' + hint.sender + ' 18%, transparent)');
      }
    } catch (e) { }
  </script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none
    }

    html,
    body,
    body * {
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none
    }

    input,
    textarea,
    [contenteditable="true"] {
      user-select: text;
      -webkit-user-select: text;
      -webkit-touch-callout: default
    }

    body {
      margin: 0;
      background: #111b21;
      color: #e9edef;
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      min-height: 100vh
    }

    button,
    input,
    textarea {
      font: inherit
    }

    button {
      color: inherit;
      cursor: pointer
    }

    .page {
      width: min(760px, 100%);
      min-height: 100vh;
      margin: auto;
      background: #111b21
    }

    header {
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      background: #202c33
    }

    header .back {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #171b21;
      color: inherit;
      display: grid;
      place-items: center
    }

    header .back svg {
      width: 22px;
      height: 22px;
      fill: currentColor
    }

    header b {
      font-size: 17px
    }

    main {
      padding: 18px;
      display: grid;
      gap: 16px
    }

    .manager {
      border: 1px solid #ffffff12;
      border-radius: 16px;
      background: #202c33
    }

    .primary,
    .secondary,
    .danger {
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: #2a3942;
      color: #e9edef
    }

    .primary {
      background: var(--accent);
      color: var(--accent-ink)
    }

    .manager {
      padding: 16px
    }

    .managerHead {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px
    }

    .managerHead div {
      flex: 1
    }

    .managerHead h2 {
      font-size: 16px;
      margin: 0 0 3px
    }

    .muted,
    .managerHead p {
      font-size: 12px;
      color: #8696a0;
      margin: 0
    }

    .cards {
      display: grid;
      gap: 10px
    }

    .card {
      position: relative;
      z-index: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 12px;
      background: #172127;
      min-width: 0;
      border: 1px solid #ffffff0a;
      transition: background .18s ease, border-color .18s ease
    }

    .card:hover {
      background: #1b292f;
      border-color: #ffffff20
    }

    .card.menuOpen {
      z-index: 10
    }

    .preview {
      position: relative;
      width: 68px;
      height: 68px;
      flex: none;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 0;
      border-radius: 10px;
      background: #0c1114;
      padding: 0;
      color: #d6e4e9;
      transition: filter .18s ease, transform .18s ease
    }

    .preview:hover {
      filter: brightness(1.12);
      transform: scale(1.03)
    }

    .preview:focus-visible,
    .cardMenuToggle:focus-visible,
    .managerHead button:focus-visible {
      outline: 2px solid #00d9a5;
      outline-offset: 2px
    }

    .preview img,
    .preview video {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .preview .textPreview {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 5px;
      color: white;
      font-size: 10px;
      overflow: hidden
    }

    .preview .audioType {
      display: grid;
      justify-items: center;
      gap: 3px;
      color: #b9f3e3;
      font-size: 10px;
      font-weight: 700
    }

    .preview .audioType svg {
      width: 24px;
      height: 24px;
      fill: currentColor
    }

    .preview .kindIcon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff18;
      color: #fff
    }

    .preview .kindIcon svg {
      width: 24px;
      height: 24px;
      fill: currentColor
    }

    .details {
      min-width: 0;
      flex: 1
    }

    .details b {
      font-size: 14px
    }

    .details .muted {
      margin-top: 5px;
      line-height: 1.4
    }

    .cardMenu {
      position: relative;
      flex: none
    }

    .cardMenuToggle {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #b9c7ce;
      transition: color .18s ease
    }

    .cardMenuToggle:hover,
    .cardMenuToggle[aria-expanded="true"] {
      background: transparent;
      color: #fff
    }

    .cardMenuToggle svg circle:first-child {
      transform: translate(7px, -7px)
    }

    .cardMenuToggle svg circle:last-child {
      transform: translate(-7px, 7px)
    }

    .cardMenuToggle:focus-visible,
    .cardMenuToggle svg {
      width: 22px;
      height: 22px;
      fill: currentColor
    }

    .uploadStatus {
      position: fixed;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 7;
      width: min(460px, calc(100% - 32px));
      padding: 12px 16px;
      transform: translateX(-50%);
      border: 1px solid #ffffff18;
      border-radius: 14px;
      background: #202c33f2;
      color: #e9edef;
      font-size: 13px;
      box-shadow: 0 8px 28px #0008;
      backdrop-filter: blur(14px)
    }


    @keyframes story-menu-enter {
      from { opacity: 0; transform: translateY(-4px) scale(.98) }
      to { opacity: 1; transform: translateY(0) scale(1) }
    }




    @media (prefers-reduced-motion: reduce) {
    }

    .empty {
      padding: 24px 10px;
      text-align: center;
      color: #aebac1;
      font-size: 13px
    }

    .editor {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: none;
      flex-direction: column;
      background: radial-gradient(ellipse at 50% 0, #172127 0, #090c0f 58%)
    }

    .editor.on {
      display: flex;
      animation: editor-enter .2s ease-out both
    }

    @keyframes editor-enter {
      from { opacity: 0; transform: translateY(8px) }
      to { opacity: 1; transform: translateY(0) }
    }

    .editorTop {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 58px;
      padding: 8px 14px;
      background: #111b21cc;
      border-bottom: 1px solid #ffffff0d;
      backdrop-filter: blur(16px)
    }

    .editorTop b {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: .01em
    }

    .spacer {
      flex: 1
    }

    .iconBtn {
      flex: none;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #202a30;
      color: #dce5e9;
      display: grid;
      place-items: center;
      transition: background .16s, color .16s, transform .16s
    }

    .iconBtn:hover {
      background: #2a3942;
      color: #fff
    }

    .iconBtn:active {
      transform: scale(.94)
    }

    .iconBtn.on {
      background: var(--accent-soft);
      color: var(--accent)
    }

    .iconBtn:focus-visible,
    .tools button:focus-visible,
    .textColors button:focus-visible,
    .recordHold:focus-visible {
      outline: 2px solid #00d9a5;
      outline-offset: 3px
    }

    .iconBtn svg {
      width: 21px;
      height: 21px;
      fill: currentColor
    }

    .tools {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 9px 12px;
      color: #c4d0d5
    }

    .tools.on {
      display: flex
    }

    .tools button,
    .tools input[type=color] {
      width: 40px;
      height: 40px;
      padding: 8px;
      border: 1px solid #ffffff33;
      border-radius: 50%;
      background: #202a30;
      color: #e9edef;
      cursor: pointer;
      transition: background .16s, transform .16s
    }

    .tools button:hover {
      background: #2a3942
    }

    .tools button:active {
      transform: scale(.94)
    }

    .tools button:disabled {
      opacity: .38;
      cursor: default;
      transform: none
    }

    .tools button.on {
      outline: 2px solid white
    }

    .tools svg {
      width: 20px;
      height: 20px;
      fill: currentColor
    }

    .tools input[type=color] {
      padding: 4px
    }

    .tools .toolLabel {
      color: #aebac1;
      font-size: 12px
    }

    .editorBody {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: auto;
      padding: 20px 16px
    }

    .imageEditor {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 100%;
      max-height: 100%
    }

    .imageStage {
      position: relative;
      display: grid;
      place-items: center;
      max-width: 100%;
      max-height: calc(100dvh - 290px)
    }

    .imageEditor .editorTip {
      max-width: min(560px, 92vw);
      color: #aebac1;
      font-size: 12px;
      text-align: center
    }

    .imageStage img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(100%, calc(100vw - 32px));
      max-height: calc(100dvh - 250px);
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 16px 48px #0008
    }

    .drawCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none
    }

    .overlayText {
      position: absolute;
      left: 8%;
      top: 50%;
      width: 84%;
      max-height: 75%;
      overflow: auto;
      transform: translateY(-50%);
      padding: 8px;
      border: 1px dashed #ffffff66;
      border-radius: 8px;
      background: #0006;
      color: #fff;
      font-size: clamp(22px, 6vw, 38px);
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 7px #000;
      outline: none;
      overflow-wrap: anywhere
    }

    .textEditor {
      width: min(580px, 100%);
      height: min(680px, 100%);
      min-height: min(440px, 64vh);
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 14px;
      padding: clamp(20px, 5vw, 38px);
      border: 1px solid #ffffff20;
      border-radius: 24px;
      box-shadow: 0 20px 60px #0006;
      transition: background .18s ease
    }

    .textEditor .textEntry {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
      gap: 14px
    }

    .textEditor .textPrompt {
      color: #ffffffb5;
      font-size: 13px;
      font-weight: 600;
      text-align: center
    }

    .textEditor textarea {
      width: 100%;
      min-height: 0;
      height: 100%;
      padding: 0;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: #fff;
      text-align: center;
      font-size: clamp(20px, 5vw, 30px);
      line-height: 1.25;
      font-weight: 650;
      text-shadow: 0 2px 10px #0004;
      overflow-wrap: anywhere;
      overflow-x: hidden;
      overflow-y: auto
    }

    .textEditor textarea::placeholder {
      color: #ffffffa0
    }

    .textEditor .textFoot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #ffffffb5;
      font-size: 12px;
      font-variant-numeric: tabular-nums
    }

    #textCount.near-limit {
      color: #ffca75
    }

    .blankCanvasWrap {
      position: relative;
      width: min(560px, 92vw);
      height: min(70vh, 680px);
      overflow: hidden;
      border: 1px solid #ffffff24;
      border-radius: 20px;
      background: #7b61ff;
      box-shadow: 0 18px 54px #0007
    }

    .blankCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none
    }

    .audioPanel {
      width: min(460px, 100%);
      padding: clamp(20px, 5vw, 30px);
      border: 1px solid #ffffff14;
      border-radius: 24px;
      background: linear-gradient(155deg, #171b21, #101419);
      text-align: center;
      box-shadow: 0 20px 60px #0006
    }

    .audioMicIcon {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border: 1px solid #ffffff18;
      border-radius: 50%;
      background: #d3dbe11a;
      color: #d3dbe1
    }

    .audioMicIcon svg {
      width: 30px;
      height: 30px;
      fill: currentColor
    }

    .audioPanel h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 650
    }

    .audioPanel p {
      min-height: 24px;
      margin: 8px 0 12px;
      color: #aebac1;
      font-size: 13px;
      line-height: 1.5
    }

    .recordWave {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 118px;
      margin: 18px 0 16px;
      color: #d3dbe1
    }

    .recordWave span {
      width: 5px;
      height: var(--wave-height, 24px);
      border-radius: 99px;
      background: currentColor;
      opacity: .64;
      transition: opacity .2s ease, transform .2s ease
    }

    .audioPanel.is-recording .recordWave span {
      opacity: 1;
      animation: record-wave .55s ease-in-out infinite alternate;
      animation-delay: var(--wave-delay, 0ms)
    }

    @keyframes record-wave {
      to { transform: scaleY(.55); opacity: .55 }
    }

    .audioControls {
      display: flex;
      justify-content: center;
      margin: 12px auto 8px
    }

    .recordHold {
      display: grid;
      justify-items: center;
      gap: 12px;
      min-width: 130px;
      min-height: 110px;
      border: 0;
      border-radius: 0;
      padding: 4px 12px;
      background: transparent;
      color: #d5dce2;
      font-size: 13px;
      font-weight: 500;
      user-select: none;
      transition: transform .16s, color .16s
    }

    .recordHold svg {
      width: 76px;
      height: 76px;
      padding: 22px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      fill: currentColor;
      box-shadow: 0 8px 32px color-mix(in srgb, var(--accent) 28%, transparent);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease
    }

    .recordHold:hover {
      color: #fff;
    }

    .recordHold:hover svg {
      transform: scale(1.06);
      background: var(--accent-hover)
    }

    .recordHold:active,
    .recordHold.is-recording {
      transform: scale(.96);
      color: #fff
    }

    .recordHold.is-recording svg {
      background: #d9444a;
      box-shadow: 0 0 0 8px #d9444a24
    }

    .recordHint {
      display: block;
      color: #8696a0;
      font-size: 12px
    }

    .audioPlayback {
      width: 100%;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #ffffff12
    }

    .audioPlayback[hidden] {
      display: none
    }

    .audioPlayback audio {
      display: none
    }

    .audioPlaybackWave {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      height: 36px;
      margin-bottom: 14px;
      color: var(--accent)
    }

    .audioPlaybackWave span {
      width: 3px;
      height: var(--wave-height, 12px);
      border-radius: 99px;
      background: currentColor;
      opacity: .68
    }

    .audioPlayback.is-playing .audioPlaybackWave span {
      animation: story-audio-wave .75s ease-in-out infinite alternate;
      animation-delay: var(--wave-delay, 0ms)
    }

    @keyframes story-audio-wave {
      to { transform: scaleY(.3); opacity: .45 }
    }

    .audioPlaybackControls {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      align-items: center;
      gap: 12px
    }

    .audioPlaybackPlay {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      padding: 15px;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 22%, transparent)
    }

    .audioPlaybackPlay:hover {
      background: var(--accent-hover)
    }

    .audioPlaybackPlay svg {
      width: 100%;
      height: 100%;
      fill: currentColor
    }

    .audioPlaybackTrack {
      display: grid;
      gap: 8px;
      min-width: 0
    }

    .audioPlaybackTrack input {
      width: 100%;
      height: 5px;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 99px;
      appearance: none;
      background: linear-gradient(to right, #00d9a5 var(--audio-progress, 0%), #ffffff38 var(--audio-progress, 0%));
      cursor: pointer
    }

    .audioPlaybackTrack input::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      appearance: none;
      border: 0;
      border-radius: 50%;
      background: #00d9a5
    }

    .audioPlaybackTrack input::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #00d9a5
    }

    .audioPlaybackTimes {
      display: flex;
      justify-content: space-between;
      color: #aebac1;
      font-size: 11px;
      font-variant-numeric: tabular-nums
    }

    .recordStatus {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px
    }

    .recordStatus.is-recording::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f05258;
      box-shadow: 0 0 0 4px #f0525824;
      animation: record-pulse 1.2s ease-in-out infinite
    }

    @keyframes record-pulse {
      50% { opacity: .45; transform: scale(.8) }
    }

    .audioPanel audio {
      display: none;
      width: 100%;
      height: 42px;
      margin-top: 20px;
      accent-color: #d3dbe1
    }

    .audioPanel audio.ready {
      display: block
    }

    .storyAudioCard {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      align-items: center;
      gap: 12px;
      width: min(460px, 92vw);
      padding: 18px;
      border: 1px solid #ffffff20;
      border-radius: 18px;
      background: linear-gradient(145deg, #202a30, #11171b);
      color: #e9edef;
      box-shadow: 0 16px 48px #0006
    }

    .storyAudioPlay {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink)
    }

    .storyAudioPlay svg {
      width: 24px;
      height: 24px;
      fill: currentColor
    }

    .storyAudioInfo {
      min-width: 0
    }

    .storyAudioInfo b {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px
    }

    .storyAudioInfo .muted {
      margin-top: 4px
    }

    .storyAudioProgress {
      height: 5px;
      margin-top: 12px;
      overflow: hidden;
      border-radius: 5px;
      background: #ffffff32;
      cursor: pointer;
      touch-action: none
    }

    .storyAudioProgress span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--accent)
    }

    .storyAudioTime {
      display: flex;
      justify-content: space-between;
      margin-top: 5px;
      color: #aebac1;
      font-size: 11px
    }

    .textColors {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
      padding: 12px 16px;
      border-top: 1px solid #ffffff0d;
      background: #111b21a8
    }

    .textColors .paletteLabel {
      flex: none;
      margin-right: 2px;
      color: #aebac1;
      font-size: 12px;
      font-weight: 600
    }

    .textColors button {
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 2px solid #ffffff50;
      border-radius: 50%
    }

    .textColors input[type="color"] {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      padding: 2px;
      border: 1px solid #ffffff50;
      border-radius: 50%;
      background: transparent;
